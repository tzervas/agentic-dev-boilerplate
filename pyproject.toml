[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dev-boilerplate"
version = "1.1.4"
description = "Reference ADK + SKILL.md house agent. Product birth is tz-new; diet is house-pack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Tyler Zervas", email = "111450100+tzervas@users.noreply.github.com" },
]
maintainers = [
    { name = "Tyler Zervas", email = "111450100+tzervas@users.noreply.github.com" },
]
keywords = ["adk", "skills", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "click==8.4.2",
    "chngbrgr>=0.1.0",
]

[project.optional-dependencies]
adk = ["google-adk>=2,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]
docs = [
    "sphinx==9.0.4",
    "sphinx-rtd-theme==3.1.0",
]

[project.scripts]
agentic-dev-boilerplate = "agentic_dev_boilerplate.generate_boilerplate:main"

[project.urls]
Homepage = "https://github.com/tzervas/agentic-dev-boilerplate"
Repository = "https://github.com/tzervas/agentic-dev-boilerplate"
Changelog = "https://github.com/tzervas/agentic-dev-boilerplate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_dev_boilerplate"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agentic_dev_boilerplate",
  "templates",
  "pack",
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "project-schema.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentic_dev_boilerplate"]
omit = [
    "tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.8",
    "twine>=6.2.0",
]
